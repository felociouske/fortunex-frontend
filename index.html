<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Core viewport & rendering -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="theme-color" content="#0a0a12" />
    <meta name="color-scheme" content="dark" />

    <!-- Primary SEO -->
    <title>FortuneX - Digital Trading Platform. Forex, Options, Multipliers, AI & Bots</title>
    <meta name="description" content="Trade forex, synthetic indices, options, multipliers and automated bots on FortuneX | A fast, secure online trading platform built for traders. Deposit via M-Pesa, trade in real-time, and automate your strategy with FortuneX AI and FortuneX Bots." />
    <meta name="keywords" content="FortuneX, FortuNex, online trading platform Kenya, forex trading Kenya, binary options trading, synthetic indices trading, multipliers trading, trading bots, AI trading platform, algorithmic trading Kenya, M-Pesa trading platform, Deriv alternative Kenya, online forex broker, automated trading bots, crypto trading Kenya, digital trading platform, options trading online, forex signals Kenya, trading app Kenya" />
    <meta name="author" content="FortuneX" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <link rel="canonical" href="https://fortunextrades.com/" />

    <!-- Language / region targeting -->
    <meta name="geo.region" content="KE" />
    <meta name="geo.placename" content="Kenya" />
    <link rel="alternate" hreflang="en" href="https://fortunextrades.com/" />
    <link rel="alternate" hreflang="x-default" href="https://fortunextrades.com/" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="FortuneX" />
    <meta name="theme-color" content="#0a0a12" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FortuneX" />
    <meta property="og:title" content="FortuneX - Digital Trading Platform. Forex, Options, Multipliers, AI & Bots" />

    <meta property="og:image" content="https://fortunextrades.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FortuneX trading platform dashboard" />
    <meta property="og:locale" content="en_KE" />

    <meta name="twitter:image" content="https://fortunextrades.com/og-image.png" />

    <link rel="icon" type="image/svg+png" href="/favicon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />

    <link rel="apple-touch-icon" href="/favicon.png" />

    <meta name="msapplication-TileImage" content="/icons/icon-192.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="FortuneX" />
    <meta name="apple-mobile-web-app-title" content="FortuneX" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Performance: preconnect to any external origins you actually use -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
